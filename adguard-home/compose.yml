services:
  adguard:
    image: adguard/adguardhome:${ADGUARD_VERSION:-latest}
    healthcheck:
      # The setup wizard serves on 3000; once setup is done the admin UI serves on 80.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || wget -q --spider http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - ${ADGUARD_CONFIG_PORT:-5001}:3000 # Config UI
      - ${ADGUARD_PORT:-5000}:80          # Admin UI
      - 53:53/tcp                         # DNS
      - 53:53/udp                         # DNS
    volumes:
      - work:/opt/adguardhome/work
      - conf:/opt/adguardhome/conf
    restart: unless-stopped

volumes:
  work:
  conf:
