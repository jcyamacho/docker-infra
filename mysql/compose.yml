services:
  mysql:
    image: mysql:${MYSQL_VERSION:-latest}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    ports:
      - 3306:3306
    volumes:
      - mysql:/var/lib/mysql
    networks:
      - mysql
    healthcheck:
      # TCP only answers after initialization; the socket also answers during it.
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  phpmyadmin:
    image: phpmyadmin:latest
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - ${PHPMYADMIN_PORT:-5000}:80
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mysql

volumes:
  mysql:


networks:
  mysql:
    name: mysql
    driver: bridge
