# password: admin
# https://github.com/grafana/docker-otel-lgtm
services:
  otel:
    image: grafana/otel-lgtm:${GRAFANA_OTEL_VERSION:-latest}
    ports:
      - ${GRAFANA_PORT:-3000}:3000
      - 4317:4317 # OTLP/GRPC
      - 4318:4318 # OTLP/HTTP
    volumes:
      - otel:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/otel-lgtm/docker/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  otel:
