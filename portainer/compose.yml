services:
  portainer:
    image: portainer/portainer-ce:${PORTAINER_VERSION:-latest}
    volumes:
      - portainer:/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - ${PORTAINER_PORT:-9000}:9000
    restart: unless-stopped
    # No healthcheck: the image contains only the portainer binary (no shell, curl, or wget).

volumes:
  portainer:
